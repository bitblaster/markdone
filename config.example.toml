# Markdone configuration — copy to ~/.config/markdone/config.toml (or pass --config <path>).
# Everything here is optional; omitted keys fall back to the built-in defaults.
# Edit → Preferences changes the settings below and keeps your comments.

[font]
# The text font: any installed font family. Omitted: the system monospace font.
family = "Noto Sans"
# The font of code blocks and inline code: a monospace family (a proportional one, or one
# that isn't installed, falls back to the system monospace with a warning).
code_family = "JetBrains Mono"
# Base font size in logical pixels (default 18, clamped to 6–96).
size = 18.0

[editor]
# Text spans the whole window (true) or at most `max_width` logical pixels (default).
full_width = false
max_width = 1200
# Line numbers in the left margin (View → Show Line Numbers).
line_numbers = true
# In a git repository, show the changes since the last commit inline (View → Git
# Differences): added text tinted, deleted lines as faded rows.
git_diff = true

[files]
# When an open file changes on disk and has no unsaved changes: "ask" (default) or
# "reload". A document with unsaved changes is never reloaded without asking.
on_external_change = "ask"
# Also compare the files with the disk when the window gets the focus or a tab is
# selected (catches changes the file watcher misses, e.g. on network shares).
check_on_focus = true
# Save modified documents by themselves, about a second after typing stops and when they
# are closed (a new document is saved by hand the first time).
autosave = false

[network]
# Look up GitHub issues / pull requests / users referenced in documents: reads the
# repository from .git/config and calls api.github.com. Off by default.
github = false
# GitHub API token for those lookups (validation, hover cards, autocomplete). Stored in
# plain text; --github-token or the GITHUB_TOKEN variable take precedence.
# github_token = "ghp_..."

[theme]
# One theme for dark mode and one for light mode: a built-in preset, or the name of a
# custom [themes.*] you define below. Built-ins:
#   dark:  dracula (default), nord, solarized-dark, gruvbox-dark, tokyo-night, catppuccin-mocha
#   light: solarized-light, catppuccin-latte (default)
dark = "dracula"
light = "catppuccin-latte"
# The mode shown: "dark" (default) or "light" (View → Dark Mode switches it).
mode = "dark"
# Follow the system's light/dark setting instead, when the system reports one.
follow_system = false

# Optional per-color tweaks applied on top of the selected theme. Colors are hex,
# "#RRGGBB" or "#RRGGBBAA". The 12 slots are:
#   background surface foreground selection comment
#   red orange yellow green cyan purple pink
# Syntax mapping: keyword/operator = pink, function = green, type = cyan,
# string = yellow, number/constant = purple, comment = comment.
[theme.overrides]
# comment = "#7A88B8"

# Define your own themes here, then select one with `dark` or `light` above. Any color you omit
# is inherited from dracula. A [themes.<name>] shadows a built-in of the same name.
[themes.my-midnight]
background = "#0B0E14"
foreground = "#BFBDB6"
comment    = "#4D5566"
pink       = "#FF8F40"
cyan       = "#59C2FF"
green      = "#AAD94C"
