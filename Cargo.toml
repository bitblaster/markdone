[package]
name = "markdone"
version = "0.2.0"
description = "A fast, lightweight Markdown editor with live inline rendering (forked from writ)"
# Forked from writ by Wilfred Denton (MIT), https://github.com/wilfreddenton/writ
authors = ["Wilfred Denton <wilfred@hey.com>"]
license = "MIT"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
too_many_arguments = "allow"

[lib]
name = "markdone"
path = "src/lib.rs"

# The editor: winit + wgpu + Vello + Parley shell (formerly the gpui app).
[[bin]]
name = "markdone"
path = "src/bin/markdone.rs"
required-features = ["app"]

[[bin]]
name = "writd"
path = "src/writd.rs"
required-features = ["ghosttext"]

[features]
default = ["app"]

# internal: shared async + HTTP substrate (underscore = not meant for à-la-carte use)
_net = ["dep:tokio", "dep:reqwest", "dep:rustls", "dep:serde_json"]

git = ["dep:gix"]
github = ["_net"]
watch = ["dep:notify", "dep:notify-debouncer-full"]
remote-images = ["_net"]

# render ```mermaid fences as diagrams: Mermaid 12-parity SVG via merman, drawn as vectors
# (usvg → vello_svg → a Vello scene fragment)
mermaid = ["dep:merman", "dep:serde_json", "dep:vello_svg"]

# render LaTeX math ($…$ / $$…$$) via RaTeX (parse→layout→tiny-skia PNG, embedded fonts)
math = ["dep:ratex-parser", "dep:ratex-layout", "dep:ratex-render", "dep:ratex-types"]

# the full core::Editor orchestration hub (diff-from-HEAD + GitHub + file watch)
editor = ["git", "github", "watch"]

# the desktop editor application (winit shell). implies editor.
app = ["editor", "remote-images", "mermaid", "math", "dep:winit", "dep:arboard", "dep:jiff", "dep:spellbook", "dep:open", "dep:clap", "dep:toml", "dep:dirs", "dep:egui", "dep:egui-winit", "dep:egui-wgpu", "dep:rfd", "dep:toml_edit", "dep:skrifa", "dep:interprocess", "dep:pulldown-cmark", "dep:htmd", "dep:wayland-client", "dep:wayland-backend", "dep:libc", "dep:zbus", "dep:futures-util"]

# the GhostText daemon (writd binary)
ghosttext = ["app", "dep:tokio-tungstenite", "dep:futures"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"], optional = true }
futures = { version = "0.3", optional = true }
imara-diff = "0.2"
gix = { version = "0.84", default-features = false, features = ["sha1"], optional = true }
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"], optional = true }
# Local time, for the names of pasted images.
jiff = { version = "0.2", optional = true }
# Spell checking with Hunspell dictionaries (pure Rust).
spellbook = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Native mermaid → SVG: a parity-focused Rust port of Mermaid 12 (dagre via `dugong`, ELK,
# the "neo" look), which is what Zettlr 4.9 draws. `complete-svg` alone enables no diagram
# family, hence `all-diagrams`; `-elk` adds Mermaid 12's default flowchart layout (ELK is
# EPL-2.0 — see merman's THIRD_PARTY_NOTICES). No `png` feature: we draw its SVG ourselves.
merman = { version = "0.10", default-features = false, features = ["all-diagrams", "complete-svg-elk"], optional = true }
# SVG → Vello scene, so diagrams are drawn as vectors (crisp at any scale, no rasters).
# Shares usvg 0.48 with resvg below.
vello_svg = { version = "0.11", optional = true }
# LaTeX math → raster (tiny-skia, embedded KaTeX fonts; no resvg — see `math` feature).
ratex-parser = { version = "0.1.12", optional = true }
ratex-layout = { version = "0.1.12", optional = true }
ratex-render = { version = "0.1.12", features = ["embed-fonts"], optional = true }
ratex-types = { version = "0.1.12", optional = true }
# SVG rasterization (badges etc.); default features pull in text + system-fonts,
# needed to render `<text>` labels in shields.io-style badges.
resvg = "0.48"
# --- Linebender rendering stack (see MIGRATION-PLAN.md). `wgpu` is NOT a direct
# dep — we use `vello::wgpu` so there is a single wgpu in the tree. ---
parley = "0.11.1"
vello = "0.10"
# The encoding types behind `vello::Scene` (the shell compares frames' scenes).
vello_encoding = "0.10"
winit = { version = "0.30", optional = true }
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }
pollster = "0.4"
notify = { version = "8.2", optional = true }
open = { version = "5", optional = true }
regex = "1.12.2"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "json"], optional = true }
ropey = "1.6"
rustls = { version = "0.23.36", features = ["ring"], optional = true }
unicode-segmentation = "1.13"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "5", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-highlight = "0.26"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
undo = "0.52"
notify-debouncer-full = { version = "0.5", optional = true }
egui = { version = "0.35", default-features = false, features = ["default_fonts"], optional = true }
egui-winit = { version = "0.35", default-features = false, features = ["wayland", "x11"], optional = true }
egui-wgpu = { version = "0.35", default-features = false, optional = true }
rfd = { version = "0.18", optional = true }
toml_edit = { version = "0.25.19", optional = true }
skrifa = { version = "0.42", optional = true }
interprocess = { version = "2", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
htmd = { version = "0.5", optional = true }

# Optimize dependencies even in dev/test builds. writ's own code stays unoptimized
# (fast incremental compile + debuggable), but the graphics/parsing stack (wgpu, vello,
# parley/swash, tree-sitter, gix, …) runs at opt-level 2. Without this a debug build shapes
# text ~10× slower and its large unoptimized working set page-faults in over the first ~30s
# of use — making the editor feel sluggish at startup even though release is smooth.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Drop the symbol table (~11 MB, mostly merman's): not needed to run, only for symbol
# names in crash backtraces.
strip = true

# merman (the mermaid renderer) is ~20 MB of code across every diagram family, and renders
# run off-thread in a few ms: optimize it for size rather than speed.
[profile.release.package.merman]
opt-level = "s"
[profile.release.package.merman-core]
opt-level = "s"
[profile.release.package.merman-render]
opt-level = "s"
[profile.release.package.merman-model]
opt-level = "s"
[profile.release.package.merman-markup]
opt-level = "s"
[profile.release.package.merman-theme-contract]
opt-level = "s"
[profile.release.package.merman-unicode-linebreak]
opt-level = "s"
[profile.release.package.merman-layout-elk]
opt-level = "s"
[profile.release.package.merman-elk-layered]
opt-level = "s"
[profile.release.package.dugong]
opt-level = "s"
[profile.release.package.dugong-graphlib]
opt-level = "s"
[profile.release.package.roughr-merman]
opt-level = "s"

# Fast release builds for development (cargo build --profile release-fast)
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[dev-dependencies]
vello = "0.10"

# build.rs: embed the icon and version info in the Windows executables.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Wayland drag-and-drop of files (winit 0.30 has none on Wayland): a second connection on
# winit's display. Same versions as winit's, so nothing new is built.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
libc = { version = "0.2", optional = true }
# The system light/dark preference: the XDG desktop portal over D-Bus (winit reports it
# only on Windows/macOS). Pure-Rust client on the app's existing tokio runtime.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
